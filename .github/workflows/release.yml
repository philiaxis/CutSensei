name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-14 }
          - { name: macos-x64, os: macos-13 }
          - { name: linux-x64, os: ubuntu-22.04 }
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libpulse0 \
            libxcb-cursor0 libfontconfig1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pillow

      - name: Build
        run: python packaging/build.py

      - name: Smoke test (bundle starts, CLI works)
        shell: bash
        env:
          CUTSENSEI_SMOKE_TEST: ${{ github.workspace }}/smoke.png
          CUTSENSEI_SETTINGS: ${{ github.workspace }}/smoke.ini
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then APP=dist/CutSensei.app/Contents/MacOS/CutSensei
          elif [ "$RUNNER_OS" = "Windows" ]; then APP=dist/CutSensei/CutSensei.exe
          else APP=dist/CutSensei/CutSensei; fi
          "$APP" --cli info || true
          "$APP"
          test -s "$CUTSENSEI_SMOKE_TEST"

      - uses: actions/upload-artifact@v4
        with:
          name: CutSensei-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
