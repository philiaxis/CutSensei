name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libpulse0 libxcb-cursor0 libfontconfig1 fonts-noto-cjk

      - name: FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      # Windows uses the FFmpeg binary shipped with imageio-ffmpeg (no install needed)

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Environment
        run: python -m cutsensei.cli info

      - name: Quick tests
        if: matrix.python == '3.10'
        run: python -m pytest -q -m "not slow"

      - name: Full test suite
        if: matrix.python == '3.12'
        run: python -m pytest -q
