[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cutsensei"
dynamic = ["version"]
description = "Automatic editor for lecture videos: speech at normal speed, silent board writing sped up, idle time removed."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Philiaxis" }]
requires-python = ">=3.9"
keywords = ["video", "editor", "lecture", "education", "ffmpeg", "vad", "jump-cut"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Japanese",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = [
    "numpy>=1.23",
    "opencv-python-headless>=4.7",
    "PySide6-Essentials>=6.6",
    "PySide6-Addons>=6.6",
    "onnxruntime>=1.16",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.16"]
dev = ["pytest>=7", "pytest-qt>=4.2", "pyinstaller>=6.3"]

[project.urls]
Homepage = "https://github.com/philiaxis/CutSensei"
Issues = "https://github.com/philiaxis/CutSensei/issues"

[project.scripts]
cutsensei-cli = "cutsensei.cli:main"

[project.gui-scripts]
cutsensei = "cutsensei.app:main"

[tool.setuptools.dynamic]
version = { attr = "cutsensei.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cutsensei = ["models/*.onnx", "models/*LICENSE*", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end tests that encode video (deselect with -m 'not slow')",
    "gui: tests that need a Qt platform",
]
